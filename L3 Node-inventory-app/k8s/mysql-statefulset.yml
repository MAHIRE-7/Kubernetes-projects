apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: inv-ns
spec: 
  serviceName: mysql-service
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db 
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql-container 
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: 
                configMapKeyRef:
                  name: inv-configmap
                  key: DB_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom: 
                configMapKeyRef:
                  name: inv-configmap
                  key: DB_NAME
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  

  


