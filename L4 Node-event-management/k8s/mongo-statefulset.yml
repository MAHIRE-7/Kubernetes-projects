apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-statefulset 
  namespace: em-ns
spec:
  selector:
    matchLabels:
      db: mongo
  replicas: 1
  template:
    metadata:
      labels:
        db: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
         
