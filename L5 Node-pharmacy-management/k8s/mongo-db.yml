apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db
  namespace: ph-ns
spec:
  selector:
    matchLabels:
      db: mongo
  template:
    metadata:
      labels:
        db: mongo
    spec:
      containers:
        - name: mongo-container
          image: mongo:latest
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
  namespace: ph-ns
spec:
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    db: mongo
  type: ClusterIP