kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: pharmacy-app-hpa
  namespace: ph-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pharmacy-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50