apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: restro-nss
  
spec:
  serviceName: mysql-service
  replicas: 1
  selector:     
    matchLabels:
      app: mysql
  
  template:
    metadata:
      labels:
       app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              configMapKeyRef:
                name: restro-configmap
                key: DB_PASSWORD

          - name: MYSQL_DATABASE
            valueFrom:
              configMapKeyRef:
                name: restro-configmap
                key: DB_NAME
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
  



