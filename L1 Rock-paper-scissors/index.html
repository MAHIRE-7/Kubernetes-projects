<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissors</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: linear-gradient(45deg, #ff9a9e, #fecfef); }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .choices { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .choice-btn { width: 100px; height: 100px; border: none; border-radius: 50%; font-size: 40px; cursor: pointer; background: #f0f0f0; transition: all 0.3s; }
        .choice-btn:hover { transform: scale(1.1); background: #e0e0e0; }
        .result { margin: 30px 0; padding: 20px; border-radius: 10px; font-size: 18px; }
        .win { background: #d4edda; color: #155724; }
        .lose { background: #f8d7da; color: #721c24; }
        .tie { background: #fff3cd; color: #856404; }
        .score { display: flex; justify-content: space-around; margin: 20px 0; }
        .score-item { padding: 10px; background: #f8f9fa; border-radius: 8px; }
        button { padding: 10px 20px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .reset-btn { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Rock Paper Scissors</h1>
        
        <div class="score">
            <div class="score-item">Wins: <span id="wins">0</span></div>
            <div class="score-item">Losses: <span id="losses">0</span></div>
            <div class="score-item">Ties: <span id="ties">0</span></div>
        </div>
        
        <p>Choose your weapon:</p>
        <div class="choices">
            <button class="choice-btn" onclick="play('rock')">🪨</button>
            <button class="choice-btn" onclick="play('paper')">📄</button>
            <button class="choice-btn" onclick="play('scissors')">✂️</button>
        </div>
        
        <div id="result"></div>
        
        <button class="reset-btn" onclick="resetScore()">Reset Score</button>
    </div>

    <script>
        let wins = 0, losses = 0, ties = 0;

        async function play(choice) {
            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ choice })
                });
                
                const data = await response.json();
                displayResult(data);
                updateScore(data.result);
            } catch (error) {
                document.getElementById('result').innerHTML = '<div class="result lose">Error playing game</div>';
            }
        }

        function displayResult(data) {
            const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
            const messages = {
                win: 'You Win! 🎉',
                lose: 'You Lose! 😢',
                tie: "It's a Tie! 🤝"
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="result ${data.result}">
                    <p>You: ${emojis[data.playerChoice]} vs Computer: ${emojis[data.computerChoice]}</p>
                    <h3>${messages[data.result]}</h3>
                </div>
            `;
        }

        function updateScore(result) {
            if (result === 'win') wins++;
            else if (result === 'lose') losses++;
            else ties++;
            
            document.getElementById('wins').textContent = wins;
            document.getElementById('losses').textContent = losses;
            document.getElementById('ties').textContent = ties;
        }

        function resetScore() {
            wins = losses = ties = 0;
            document.getElementById('wins').textContent = '0';
            document.getElementById('losses').textContent = '0';
            document.getElementById('ties').textContent = '0';
            document.getElementById('result').innerHTML = '';
        }
    </script>
</body>
</html>
