apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysql-db
  
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql-containers
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: mysql-configmap
                  key: MYSQL_ROOT_PASSWORD #env variable fetch from the ConfigMap


            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi