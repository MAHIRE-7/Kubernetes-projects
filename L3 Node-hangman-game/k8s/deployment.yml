apiVersion: apps/v1
kind: Deployment
metadata:
  name: hangman-deployment 
  namespace: hangman-ns
spec:
  replicas: 2
  selector:   
    matchLabels:
      app: hangman-app
  template:
    metadata:
      labels:
        app: hangman-app
    spec: 
      containers:
      - name: hangman-container
        image: manodayahire/hangman-game:latest
        ports:
        - containerPort: 3000
        
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: hangman-configmap
                key: DB_HOST

          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: hangman-configmap
                key: DB_USER
          - name: DB_PASSWORD

            valueFrom:
              configMapKeyRef:
                name: hangman-configmap
                key: DB_PASSWORD

          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: hangman-configmap
                key: DB_NAME