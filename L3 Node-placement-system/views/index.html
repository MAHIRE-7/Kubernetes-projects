<!DOCTYPE html>
<html>
<head>
    <title>🎓 Smart Placement Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }
        
        .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 60px; height: 60px; left: 20%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 100px; height: 100px; left: 35%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 40px; height: 40px; left: 50%; animation-delay: 6s; }
        .shape:nth-child(5) { width: 120px; height: 120px; left: 70%; animation-delay: 8s; }
        .shape:nth-child(6) { width: 90px; height: 90px; left: 85%; animation-delay: 10s; }
        
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            animation: slideDown 0.8s ease-out;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }
        
        .logo {
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6)); }
        }
        
        .nav-tabs {
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
        }
        
        .nav-tab {
            padding: 12px 25px;
            border: none;
            background: transparent;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }
        
        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .nav-tab:hover::before {
            left: 100%;
        }
        
        .nav-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }
        
        .hero-section {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInUp 1s ease-out;
        }
        
        .hero-title {
            font-size: 4em;
            font-weight: 800;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            animation: titlePulse 3s ease-in-out infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .hero-subtitle {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            margin-bottom: 30px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
        }
        
        .stat-card:nth-child(1) { animation-delay: 0s; }
        .stat-card:nth-child(2) { animation-delay: 1.5s; }
        .stat-card:nth-child(3) { animation-delay: 3s; }
        .stat-card:nth-child(4) { animation-delay: 4.5s; }
        
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-card i {
            font-size: 3.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            animation: iconSpin 10s linear infinite;
        }
        
        @keyframes iconSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .stat-card h3 {
            font-size: 3em;
            margin-bottom: 10px;
            color: white;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .stat-card p {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            font-size: 1.1em;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 40px;
            animation: sectionSlide 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }
        
        .section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: rotate 20s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .section-content {
            position: relative;
            z-index: 1;
        }
        
        @keyframes sectionSlide {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .section.hidden { 
            display: none; 
        }
        
        .section h2 {
            margin-bottom: 30px;
            color: white;
            font-weight: 700;
            font-size: 2.2em;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: white;
            font-size: 1.1em;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Poppins', sans-serif;
        }
        
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .btn {
            padding: 18px 35px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1em;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.2));
        }
        
        .table-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            margin-top: 30px;
            backdrop-filter: blur(20px);
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th,
        .table td {
            padding: 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .table th {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .company-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .company-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.8s;
        }
        
        .company-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .company-card:hover::before {
            left: 100%;
        }
        
        .company-card h4 {
            color: white;
            margin-bottom: 15px;
            font-size: 1.5em;
            font-weight: 600;
        }
        
        .company-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }
        
        .detail-item i {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .hidden { display: none; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 2.5em; }
            .nav-container { padding: 0 20px; }
            .container { padding: 20px; }
            .section { padding: 25px; }
            .form-grid { grid-template-columns: 1fr; }
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> Smart Placement Pro
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="showSection('dashboard')">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </button>
                <button class="nav-tab" onclick="showSection('students')">
                    <i class="fas fa-users"></i> Students
                </button>
                <button class="nav-tab" onclick="showSection('companies')">
                    <i class="fas fa-building"></i> Companies
                </button>
                <button class="nav-tab" onclick="showSection('applications')">
                    <i class="fas fa-file-alt"></i> Applications
                </button>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="hero-section">
            <h1 class="hero-title">🚀 Future Starts Here</h1>
            <p class="hero-subtitle">Connecting brilliant minds with amazing opportunities</p>
        </div>
        
        <!-- Dashboard -->
        <div id="dashboard" class="section">
            <div class="section-content">
                <h2><i class="fas fa-chart-pie"></i> Dashboard Overview</h2>
                <div class="dashboard-grid" id="dashboardStats">
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <h3 id="studentCount">0</h3>
                        <p>Registered Students</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-building"></i>
                        <h3 id="companyCount">0</h3>
                        <p>Active Companies</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-file-alt"></i>
                        <h3 id="applicationCount">0</h3>
                        <p>Total Applications</p>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-trophy"></i>
                        <h3 id="selectionCount">0</h3>
                        <p>Success Stories</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Students -->
        <div id="students" class="section hidden">
            <div class="section-content">
                <h2><i class="fas fa-user-plus"></i> Student Registration</h2>
                <form id="studentForm" enctype="multipart/form-data">
                    <div class="form-grid">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Full Name</label>
                            <input type="text" name="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-envelope"></i> Email Address</label>
                            <input type="email" name="email" placeholder="your.email@example.com" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-phone"></i> Phone Number</label>
                            <input type="tel" name="phone" placeholder="+91 9876543210" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-code-branch"></i> Branch</label>
                            <select name="branch" required>
                                <option value="">Select Your Branch</option>
                                <option value="CSE">🖥️ Computer Science Engineering</option>
                                <option value="IT">💻 Information Technology</option>
                                <option value="ECE">📡 Electronics & Communication</option>
                                <option value="EEE">⚡ Electrical & Electronics</option>
                                <option value="MECH">⚙️ Mechanical Engineering</option>
                                <option value="CIVIL">🏗️ Civil Engineering</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-chart-line"></i> CGPA</label>
                            <input type="number" name="cgpa" step="0.01" min="0" max="10" placeholder="8.50" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-file-pdf"></i> Resume (PDF)</label>
                            <input type="file" name="resume" accept=".pdf" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-rocket"></i> Register Now
                    </button>
                </form>
                
                <div id="studentsList"></div>
            </div>
        </div>
        
        <!-- Companies -->
        <div id="companies" class="section hidden">
            <div class="section-content">
                <h2><i class="fas fa-plus-circle"></i> Add Company Drive</h2>
                <form id="companyForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label><i class="fas fa-building"></i> Company Name</label>
                            <input type="text" name="name" placeholder="Google, Microsoft, etc." required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign"></i> Package (LPA)</label>
                            <input type="number" name="package" step="0.1" min="0" placeholder="12.5" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-chart-line"></i> Minimum CGPA</label>
                            <input type="number" name="min_cgpa" step="0.01" min="0" max="10" placeholder="7.0" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-calendar"></i> Drive Date</label>
                            <input type="date" name="drive_date" required>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-code-branch"></i> Eligible Branches</label>
                            <select name="eligible_branches" multiple>
                                <option value="CSE">Computer Science</option>
                                <option value="IT">Information Technology</option>
                                <option value="ECE">Electronics & Communication</option>
                                <option value="EEE">Electrical & Electronics</option>
                                <option value="MECH">Mechanical</option>
                                <option value="CIVIL">Civil</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-info-circle"></i> Job Description</label>
                            <textarea name="description" rows="3" placeholder="Brief description about the role and company..."></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Launch Drive
                    </button>
                </form>
                
                <div id="companiesList"></div>
            </div>
        </div>
        
        <!-- Applications -->
        <div id="applications" class="section hidden">
            <div class="section-content">
                <h2><i class="fas fa-file-alt"></i> Application Management</h2>
                <div id="applicationsList">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function showSection(sectionName) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.section').forEach(section => section.classList.add('hidden'));
            
            event.target.classList.add('active');
            document.getElementById(sectionName).classList.remove('hidden');
            
            if (sectionName === 'dashboard') loadDashboard();
            if (sectionName === 'students') loadStudents();
            if (sectionName === 'companies') loadCompanies();
            if (sectionName === 'applications') loadApplications();
        }
        
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const stats = await response.json();
                
                // Animate counters
                animateCounter('studentCount', stats.students);
                animateCounter('companyCount', stats.companies);
                animateCounter('applicationCount', stats.applications);
                animateCounter('selectionCount', stats.selections);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        function animateCounter(elementId, targetValue) {
            const element = document.getElementById(elementId);
            let currentValue = 0;
            const increment = targetValue / 50;
            const timer = setInterval(() => {
                currentValue += increment;
                if (currentValue >= targetValue) {
                    element.textContent = targetValue;
                    clearInterval(timer);
                } else {
                    element.textContent = Math.floor(currentValue);
                }
            }, 30);
        }
        
        async function loadStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                
                const studentsDiv = document.getElementById('studentsList');
                if (students.length === 0) {
                    studentsDiv.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); margin-top: 30px; font-size: 1.2em;">🎓 No students registered yet. Be the first!</p>';
                    return;
                }
                
                studentsDiv.innerHTML = `
                    <h3 style="margin-top: 40px; margin-bottom: 25px; color: white; font-size: 1.8em;">✨ Registered Students</h3>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>👤 Name</th>
                                    <th>📧 Email</th>
                                    <th>🎓 Branch</th>
                                    <th>📊 CGPA</th>
                                    <th>📄 Resume</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${students.map(student => `
                                    <tr>
                                        <td>${student.name}</td>
                                        <td>${student.email}</td>
                                        <td>${student.branch}</td>
                                        <td>${student.cgpa}</td>
                                        <td>${student.resume_path ? `<a href="/uploads/${student.resume_path}" target="_blank" style="color: #4facfe;">📎 View</a>` : '❌ Not uploaded'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }
        
        async function loadCompanies() {
            try {
                const response = await fetch('/api/companies');
                const companies = await response.json();
                
                const companiesDiv = document.getElementById('companiesList');
                if (companies.length === 0) {
                    companiesDiv.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); margin-top: 30px; font-size: 1.2em;">🏢 No company drives added yet. Add the first one!</p>';
                    return;
                }
                
                companiesDiv.innerHTML = `
                    <h3 style="margin-top: 40px; margin-bottom: 25px; color: white; font-size: 1.8em;">🚀 Active Company Drives</h3>
                    ${companies.map(company => `
                        <div class="company-card">
                            <h4>🏢 ${company.name}</h4>
                            <div class="company-details">
                                <div class="detail-item">
                                    <i class="fas fa-money-bill-wave"></i>
                                    <span>💰 ${company.package} LPA</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-chart-line"></i>
                                    <span>📊 Min CGPA: ${company.min_cgpa}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-calendar-alt"></i>
                                    <span>📅 ${new Date(company.drive_date).toLocaleDateString()}</span>
                                </div>
                                <div class="detail-item">
                                    <i class="fas fa-users"></i>
                                    <span>🎓 ${company.eligible_branches.join(', ') || 'All Branches'}</span>
                                </div>
                            </div>
                            <p style="color: rgba(255,255,255,0.8); line-height: 1.6;">${company.description}</p>
                        </div>
                    `).join('')}
                `;
            } catch (error) {
                console.error('Error loading companies:', error);
            }
        }
        
        async function loadApplications() {
            document.getElementById('applicationsList').innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); font-size: 1.2em;">📋 Application management system coming soon...</p>';
        }
        
        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/api/students', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('🎉 Student registered successfully!');
                    e.target.reset();
                    loadStudents();
                } else {
                    alert('❌ Error: ' + result.error);
                }
            } catch (error) {
                alert('❌ Error registering student: ' + error.message);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        document.getElementById('companyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Launching...';
            submitBtn.disabled = true;
            
            const data = {
                name: formData.get('name'),
                description: formData.get('description'),
                package: formData.get('package'),
                min_cgpa: formData.get('min_cgpa'),
                drive_date: formData.get('drive_date'),
                eligible_branches: Array.from(formData.getAll('eligible_branches'))
            };
            
            try {
                const response = await fetch('/api/companies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('🚀 Company drive launched successfully!');
                    e.target.reset();
                    loadCompanies();
                } else {
                    alert('❌ Error: ' + result.error);
                }
            } catch (error) {
                alert('❌ Error adding company: ' + error.message);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // Initialize dashboard
        loadDashboard();
    </script>
</body>
</html>
