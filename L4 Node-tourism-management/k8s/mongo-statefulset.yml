kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: mongo-statefulset 
  namespace: tm-ns
spec:
  selector: 
    matchLabels:
      app: mongo-statefulset
  template:
    metadata:
      labels:
        app: mongo-statefulset  
    spec:
      containers:
      - name: mongo
        image: mongo:4.4
        ports:
        - containerPort: 27017
          name: mongo
       