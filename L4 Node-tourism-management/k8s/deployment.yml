kind: Deployment
apiVersion: apps/v1
metadata:
  name: tm-deployment 
  namespace: tm-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tm-app
  template:
    metadata:
      labels:
        app: tm-app
    spec:
      containers:
        - name: tm-container 
          image: manodayahire/tourism-management:v2
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MONGO_HOST
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MYSQL_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MYSQL_USER
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MYSQL_DATABASE
            - name: MYSQL_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: tm-configmap
                  key: MYSQL_PASSWORD
          resources:  
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"