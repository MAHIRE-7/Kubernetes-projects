<!DOCTYPE html>
<html>
<head>
    <title>Node Blog</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { background: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .post-form { background: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .post { background: white; padding: 20px; border-radius: 5px; margin-bottom: 15px; }
        .post-title { font-size: 1.5em; margin-bottom: 10px; color: #333; }
        .post-date { color: #666; font-size: 0.9em; margin-bottom: 15px; }
        .post-content { line-height: 1.6; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 3px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; }
        .delete-btn { background: #dc3545; padding: 5px 10px; font-size: 0.8em; }
        .no-posts { text-align: center; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Node Blog</h1>
            <p>Simple blog with persistent storage</p>
        </div>
        
        <div class="post-form">
            <h3>Write New Post</h3>
            <input type="text" id="title" placeholder="Post title" required>
            <textarea id="content" rows="5" placeholder="Post content" required></textarea>
            <button onclick="createPost()">Publish Post</button>
        </div>
        
        <div id="posts"></div>
    </div>

    <script>
        async function loadPosts() {
            const response = await fetch('/api/posts');
            const posts = await response.json();
            const postsDiv = document.getElementById('posts');
            
            if (posts.length === 0) {
                postsDiv.innerHTML = '<div class="no-posts">No posts yet. Write your first post!</div>';
                return;
            }
            
            postsDiv.innerHTML = posts.map(post => `
                <div class="post">
                    <div class="post-title">${post.title}</div>
                    <div class="post-date">${new Date(post.date).toLocaleString()}</div>
                    <div class="post-content">${post.content}</div>
                    <button class="delete-btn" onclick="deletePost('${post.id}')">Delete</button>
                </div>
            `).join('');
        }
        
        async function createPost() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            
            if (!title || !content) return;
            
            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            loadPosts();
        }
        
        async function deletePost(id) {
            if (confirm('Delete this post?')) {
                await fetch(`/api/posts/${id}`, { method: 'DELETE' });
                loadPosts();
            }
        }
        
        loadPosts();
    </script>
</body>
</html>
