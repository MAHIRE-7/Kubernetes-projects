apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: wm-ns
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: worker-app
  template:
    metadata:
      labels:
        app: worker-app
    spec:
      containers:
        - name: worker-container 
          image: manodayahire/worker-management:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              valueFrom: 
                configMapKeyRef:
                  name: wm-config
                  key: MONGO_URL
