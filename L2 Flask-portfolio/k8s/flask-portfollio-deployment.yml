apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-portfollio-deployment 
  namespace: ns-3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      volumes:
      - name: flask-app-volume
        persistentVolumeClaim:
          claimName: portfollio-pvc
      containers:
      - name: flask-app
        image: manodayahire/flask-portfollio-app
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: flask-app-volume
          mountPath: /app/projects
      
