<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 0; }
        .header h1 { text-align: center; }
        .nav { text-align: center; margin-top: 15px; }
        .nav a { color: white; text-decoration: none; margin: 0 15px; padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.2); }
        
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .form-section { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .form-section h2 { margin-bottom: 20px; color: #333; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e1e8ed; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        
        .btn { background: #667eea; color: white; padding: 12px 24px; border: none; border-radius: 25px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn:hover { background: #5a6fd8; transform: translateY(-2px); }
        
        .projects-list { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .project-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .project-item:last-child { border-bottom: none; }
        .project-info h4 { color: #333; margin-bottom: 5px; }
        .project-info p { color: #666; font-size: 0.9em; }
        .delete-btn { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        
        .success { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ Portfolio Admin</h1>
        <div class="nav">
            <a href="/">← Back to Portfolio</a>
        </div>
    </div>
    
    <div class="container">
        <div class="form-section">
            <h2>Add New Project</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Technologies (comma separated)</label>
                    <input type="text" id="tech" placeholder="React, Node.js, MongoDB" required>
                </div>
                <div class="form-group">
                    <label>GitHub URL</label>
                    <input type="url" id="github">
                </div>
                <div class="form-group">
                    <label>Demo URL</label>
                    <input type="url" id="demo">
                </div>
                <button type="submit" class="btn">Add Project</button>
            </form>
        </div>
        
        <div class="projects-list">
            <h2>Manage Projects</h2>
            <div id="projectsList">
                {% for project in projects %}
                    <div class="project-item" data-id="{{ project.id }}">
                        <div class="project-info">
                            <h4>{{ project.title }}</h4>
                            <p>{{ project.description[:100] }}...</p>
                        </div>
                        <button class="delete-btn" onclick="deleteProject('{{ project.id }}')">Delete</button>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const project = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                tech: document.getElementById('tech').value,
                github: document.getElementById('github').value,
                demo: document.getElementById('demo').value
            };
            
            const response = await fetch('/api/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(project)
            });
            
            if (response.ok) {
                location.reload();
            }
        });
        
        async function deleteProject(id) {
            if (confirm('Delete this project?')) {
                const response = await fetch(`/api/projects/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    document.querySelector(`[data-id="${id}"]`).remove();
                }
            }
        }
    </script>
</body>
</html>
