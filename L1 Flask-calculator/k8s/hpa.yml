apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: calc-app-hpa
  namespace: calc-app-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calc-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
   - type: Resource
     resource:
      name: cpu
      target:   
        type: Utilization
        averageUtilization: 50