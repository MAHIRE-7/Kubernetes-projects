apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-blog-hpa 
  namespace: flask-blog-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-blog-deployment
  minReplicas: 2
  maxReplicas: 10
 
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50