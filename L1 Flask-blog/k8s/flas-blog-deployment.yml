apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-blog-deployment
  namespace: flask-blog-ns
spec:
  selector:
    matchLabels:
      app: blog-app
  template:
    metadata: 
      labels:
        app: blog-app
    spec:
      containers:
        - name: flask-blog-app
          image: manodayahire/flask-blog-app
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "200Mi"